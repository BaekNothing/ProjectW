name: Architecture Doc Sync

on:
  pull_request:
    paths:
      - "Assets/Specification/**"
      - "Assets/Scripts/**"
      - "Assets/Tests/**"
      - "Assets/Editor/**"
      - "Assets/Resources/CaseReviewData/**"
      - "tools/sync_architecture_doc.py"
      - ".github/workflows/architecture-doc-sync.yml"

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify architecture doc matches tracked paths
        run: python tools/sync_architecture_doc.py --check
